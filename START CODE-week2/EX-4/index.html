<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="profile.css">
    <title>Document</title>
</head>
<body>
    <div class = "card" style = "background-color: white; padding:  50px;">
        <div class="top-row">
            <div class="profile-pic">
                <img src="https://media1.tenor.com/m/mD-gr4x8QXkAAAAC/maxverstappen.gif" alt="Profile" class="profile-img">
            </div>
            <div class="stats-row">
                <div class="stat-box">
                    <span class="stat-num">2120</span>
                    <span class="stat-text">Posts</span>
                </div>
                <div class="stat-box">
                    <span class="stat-num">19.3M</span>
                    <span class="stat-text">Followers</span>
                </div>
                <div class="stat-box">
                    <span class="stat-num">725</span>
                    <span class="stat-text">Following</span>
                </div>
            </div>
        </div>
        <h2 class = "name">Max Verstappen</h2>
        <p class = "role">Red Bull Formula 1 Driver</p>
        <a class = "tiktok" href = "https://www.tiktok.com/@goatmaxverstappen3/video/7640318987036904724?is_from_webapp=1&sender_device=pc">📱Tik Tok</a>
        <p class ="bio">race for Red Bull F1 team and ranked among the top 50 FIFA Ultimate Team players worldwide</p>
        <div class="highlights-track">
            <div class="highlight-item">
                <div class="highlight-ring">
                    <div class="highlight-circle"></div>
                </div>
                <span class="highlight-label">Formula 1</span>
            </div>
        
            <div class="highlight-item">
                <div class="highlight-ring">
                    <div class="highlight-circle"></div>
                </div>
                <span class="highlight-label">Race</span>
            </div>
        
            <div class="highlight-item">
                <div class="highlight-ring">
                    <div class="highlight-circle"></div>
                </div>
                <span class="highlight-label">Me</span>
            </div>
        </div>
        <button class = "btn">Messsage</button>
    </div>
</body>
</html>
