<!DOCTYPE html>
<html>
  <head>
    <title>Flexbox Pricing Table</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Sono", sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }
      .pricing-container{
        display: flex;
        flex-direction: row;
        gap: 1.5em;
        width: 1000px;
        justify-content: center;
        align-items: stretch;
      }
      .pricing-plan {
        background-color: rgb(201, 201, 201);
        border-radius: 12px;
        padding: 30px 20px;
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      }
      .pricing-plan:hover {
        transform: translateY(-6px);
        box-shadow: 0 16px 30px rgba(0, 0, 0, 0.12);
      }
      .plan-title {
        font-size: 3rem;
        font-weight: 700;
        color: #2d3748;
        margin-bottom: 12px;
      }
      .plan-price {
        font-size: 2rem;
        font-weight: 700;
        color: #4f46e5;
        margin-bottom: 24px;
      }
      .plan-features {
        list-style: none;
        padding: 0;
        flex-grow: 1; /* Pushes the button cleanly to the bottom */
      }
      .plan-features li {
        margin: 0 0 32px 0;
        width: 100%;
        padding: 10px 0;
        font-size: 0.95rem;
        color: #4a5568;
        border-bottom: 1px solid whitesmoke;
      }
      .plan-button {
        background-color: rgb(161, 90, 90);
        color: #ffffff;
        font-family: inherit;
        font-weight: 700;
        border: none;
        border-radius: 8px;
        padding: 12px 28px;
        cursor: pointer;
        width: 100%;
        font-size: 1rem;
        transition: background-color 0.2s ease;
      }
      .plan-button:hover {
        background-color: red;
      }
      /* Hint: What can you do with a media query and flexbox? */
      @media (max-width: 1250px) {
        body {
          height: auto;
          padding: 40px 16px;
        }

        .pricing-container {
          flex-direction: column;
          align-items: center;
          width: 100%;
          gap: 1.5rem;
        }

        .pricing-plan {
          width: 100%;
          max-width: 420px;
        }
      }
    </style>
  </head>

  <body>
    <div class="pricing-container">
      <div class="pricing-plan">
        <div class="plan-title">Basic</div>
        <div class="plan-price">$9.99/month</div>
        <ul class="plan-features">
          <li>✅ 10GB Storage</li>
          <li>✅ 1 User</li>
          <li>🚫 Support</li>
        </ul>
        <button class="plan-button">Sign Up</button>
      </div>
      <div class="pricing-plan">
        <div class="plan-title">Standard</div>
        <div class="plan-price">$19.99/month</div>
        <ul class="plan-features">
          <li>✅ 50GB Storage</li>
          <li>✅ 5 Users</li>
          <li>✅ Phone &amp; Email Support</li>
        </ul>
        <button class="plan-button">Sign Up</button>
      </div>
      <div class="pricing-plan">
        <div class="plan-title">Premium</div>
        <div class="plan-price">$49.99/month</div>
        <ul class="plan-features">
          <li>✅ 100GB Storage</li>
          <li>✅ 10 Users</li>
          <li>✅ 24/7 Support</li>
        </ul>
        <button class="plan-button">Sign Up</button>
      </div>
    </div>
  </body>
</html>
