<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            border-radius: 15px;
            box-sizing: border-box;
            color: white;
            font: bold;
            padding: 1em;
            margin:0;

        }
        .container{
            display: flex;
            flex-direction: column;
            height: 100vh;
            margin: 1rem;
            gap: 1em;
        }
        
        main{
            flex-grow: 1;
            display: flex;
            justify-content: space-between;
            gap: 1em;
            padding: 0;
        }
        .item{
            background-color: darkgreen;
            box-shadow: 0 4px 6px darkkhaki;
            width: 50px;
            height: 20px;
            padding: 20px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .box_item{
            display: flex;
            flex-wrap: wrap;
            gap: 1em;
            padding-top: 1em;
        }
        .left_side{
            background-color: green;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }
        .right_side{
            flex-grow: 1;
            width: 300px;
            background-color: red;
        }
        header,footer{
            background-color: blue;
            width: 100%;
            height: 200px;
            padding-right: 1em;
        }
        
    </style>
</head>
<body>
    <div class = "container">
        <header>header</header>
        <main>
            <div class="left_side">
                main
                <div class="box_item">
                    <div class="item">item</div>
                    <div class="item">item</div>
                    <div class="item">item</div>
                    <div class="item">item</div>
                    <div class="item">item</div>
                    <div class="item">item</div>
                    <div class="item">item</div>
                    <div class="item">item</div>
                </div>
            </div>
            <section class="right_side">sidebar</section>
        </main>
        <footer>footer</footer>
    </div>
</body>
</html>
